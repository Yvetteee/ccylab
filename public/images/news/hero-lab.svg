<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="t">
  <title id="t">Lab photo placeholder (wide)</title>
  <!-- warm lab room -->
  <rect width="1600" height="700" fill="#F5F1EA"/>
  <rect width="1600" height="200" fill="#EDE7DC"/>
  <!-- window light -->
  <rect x="140" y="40" width="500" height="150" fill="#FBF8F2"/>
  <rect x="980" y="40" width="480" height="150" fill="#FBF8F2"/>
  <g stroke="#E0D9CB" stroke-width="5">
    <line x1="140" y1="40" x2="140" y2="190"/><line x1="640" y1="40" x2="640" y2="190"/>
    <line x1="980" y1="40" x2="980" y2="190"/><line x1="1460" y1="40" x2="1460" y2="190"/>
  </g>
  <!-- person in lab coat at the bench -->
  <g>
    <circle cx="520" cy="150" r="64" fill="#D9C6AE"/>
    <path d="M462 150 a58 58 0 0 1 116 0" fill="#6E5F4E"/>
    <rect x="440" y="210" width="160" height="170" rx="14" fill="#E9E4DA"/>
    <rect x="440" y="210" width="160" height="170" rx="14" fill="none" stroke="#D8D1C4" stroke-width="4"/>
  </g>
  <g>
    <circle cx="1100" cy="160" r="58" fill="#D3BC9F"/>
    <path d="M1048 160 a52 52 0 0 1 104 0" fill="#85745F"/>
    <rect x="1028" y="214" width="144" height="166" rx="14" fill="#D8CFC1"/>
  </g>
  <!-- lab bench -->
  <rect x="0" y="380" width="1600" height="110" fill="#E5DFD2"/>
  <rect x="0" y="490" width="1600" height="60" fill="#D7D0C1"/>
  <rect x="0" y="380" width="1600" height="7" fill="#EFEAE0"/>
  <!-- equipment -->
  <path d="M240 380 h84 v52 a42 42 0 0 1 -84 0 z" fill="#3E7A6B" opacity="0.85"/>
  <rect x="196" y="352" width="172" height="30" rx="8" fill="#C8BFAE"/>
  <path d="M470 380 h76 v48 a38 38 0 0 1 -76 0 z" fill="#C9823C" opacity="0.9"/>
  <rect x="432" y="350" width="152" height="32" rx="8" fill="#C8BFAE"/>
  <rect x="760" y="330" width="70" height="50" rx="10" fill="#4E7F96" opacity="0.85"/>
  <rect x="752" y="356" width="86" height="26" rx="8" fill="#C8BFAE"/>
  <path d="M980 380 h72 v44 a36 36 0 0 1 -72 0 z" fill="#3E7A6B" opacity="0.7"/>
  <rect x="944" y="354" width="144" height="28" rx="8" fill="#C8BFAE"/>
  <path d="M1280 380 h80 v50 a40 40 0 0 1 -80 0 z" fill="#C9823C" opacity="0.85"/>
  <rect x="1236" y="352" width="168" height="30" rx="8" fill="#C8BFAE"/>
  <!-- bench line + label -->
  <line x1="140" y1="440" x2="1460" y2="440" stroke="#CFC8B8" stroke-width="4"/>
  <path d="M140 550 H500" stroke="#0F5E4F" stroke-width="3"/>
  <text x="140" y="640" font-family="Arial, sans-serif" font-size="24" fill="#9C9484">Lab photo — replace</text>
</svg>
